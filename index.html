<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e6e6e5}

html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden}
svg{display:block;width:100%;height:100%}
.lids{fill:none;stroke:#000;stroke-width:4.6;stroke-linejoin:miter;stroke-miterlimit:20}
/* cycle du GIF d'origine : 10 s yeux ouverts, 0,2 s yeux fermés (coupe franche) */
.open{animation:op 10.2s step-end infinite}
.closed{opacity:0;animation:cl 10.2s step-end infinite}
@keyframes op{0%{opacity:1}98.0392%{opacity:0}}
@keyframes cl{0%{opacity:0}98.0392%{opacity:1}}
@media (prefers-reduced-motion:reduce){.open,.closed{animation:none}.open{opacity:1}.closed{opacity:0}}
</style>

<script>
// Suivi du pointeur : l'anneau, l'iris et la pupille glissent sous les paupières à des vitesses différentes (profondeur)
const $=id=>document.getElementById(id),svg=document.querySelector("svg"),ring=$("ring"),iris=$("iris"),pupil=$("pupil");
const CX=2000,CY=1324.5,AX=260,AY=140,R=1400,still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let tx=0,ty=0,x=0,y=0,pt=-1e9,last=performance.now();
function mv(e){if(still)return;const r=svg.getBoundingClientRect(),s=Math.min(r.width/4000,r.height/2650),
  dx=(e.clientX-(r.left+(r.width-4000*s)/2))/s-CX,dy=(e.clientY-(r.top+(r.height-2650*s)/2))/s-CY,d=Math.hypot(dx,dy)||1,m=Math.min(1,d/R);
  tx=dx/d*m;ty=dy/d*m;pt=performance.now()}
addEventListener("pointermove",mv);addEventListener("pointerdown",mv);
document.documentElement.addEventListener("pointerleave",()=>{pt=-1e9});
const mvT=(g,k)=>g.setAttribute("transform","translate("+(x*AX*k).toFixed(1)+" "+(y*AY*k).toFixed(1)+")");
(function f(now){requestAnimationFrame(f);const dt=Math.min(.05,(now-last)/1e3);last=now;
  if(now-pt>3500){tx=0;ty=0}const k=1-Math.exp(-dt*(tx||ty?9:3));x+=(tx-x)*k;y+=(ty-y)*k;
  mvT(ring,.6);mvT(iris,1);mvT(pupil,1.35)})(performance.now());
// Mobile : l'œil suit l'inclinaison du téléphone (même mouvement que le pointeur)
const AMP=22;let base=null;
function tilt(b,g){if(still||b==null||g==null)return;
  const a=((screen.orientation&&screen.orientation.angle)||window.orientation||0)%360;
  let ix=g,iy=b; // portrait
  if(a===90){ix=b;iy=-g}else if(a===270||a===-90){ix=-b;iy=g}else if(a===180){ix=-g;iy=-b}
  if(!base||base.a!==a)base={a:a,x:ix,y:iy};
  base.x+=(ix-base.x)*.004;base.y+=(iy-base.y)*.004; // le « centre » se recale doucement
  let dx=(ix-base.x)/AMP,dy=(iy-base.y)/AMP;const d=Math.hypot(dx,dy);if(d>1){dx/=d;dy/=d}
  tx=dx;ty=dy;pt=performance.now()}
const onOri=e=>tilt(e.beta,e.gamma);
function startTilt(){const D=window.DeviceOrientationEvent;if(!D)return;
  if(typeof D.requestPermission==="function"){D.requestPermission().then(r=>{if(r==="granted")addEventListener("deviceorientation",onOri)}).catch(()=>{})}
  else addEventListener("deviceorientation",onOri)}
if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function")
  addEventListener("touchend",startTilt,{once:true}); // iPhone : autorisation après un premier toucher
else startTilt();
// Plan B : la page parente peut relayer l'inclinaison → postMessage({oeilTilt:[beta,gamma]},"*")
addEventListener("message",e=>{const t=e.data&&e.data.oeilTilt;if(Array.isArray(t))tilt(+t[0],+t[1])});
// Option d'intégration (facultatif) : ?bg=transparent  ou  ?bg=e6e6e5
const bg=new URLSearchParams(location.search).get("bg");
if(/^(transparent|[0-9a-f]{3,8})$/i.test(bg||""))document.documentElement.style.setProperty("--bg",bg==="transparent"?bg:"#"+bg);
</script>
